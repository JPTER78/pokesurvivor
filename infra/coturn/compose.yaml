name: pokesurvivor-turn
services:
  coturn:
    build: ./turn
    entrypoint: [/bin/sh, /run/run-unprivileged.sh]
    command: [turnserver, -c, /etc/coturn/turnserver.conf]
    user: "${DEPLOY_UID:?Run prepare.py first}:${DEPLOY_GID:?Run prepare.py first}"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/lib/coturn:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - ./run-unprivileged.sh:/run/run-unprivileged.sh:ro
      - ./runtime/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/certs:ro
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  credentials:
    build: ./broker
    entrypoint: [/bin/sh, /run/run-unprivileged.sh]
    command: [node, server.mjs]
    user: "${DEPLOY_UID:?Run prepare.py first}:${DEPLOY_GID:?Run prepare.py first}"
    networks: [api]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CONFIG_FILE: /run/turn/broker.json
      SECRET_FILE: /run/turn/auth-secret
      NODE_ENV: production
    volumes:
      - ./run-unprivileged.sh:/run/run-unprivileged.sh:ro
      - ./runtime/broker.json:/run/turn/broker.json:ro
      - ./runtime/auth-secret:/run/turn/auth-secret:ro
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  https:
    build: ./https
    entrypoint: [/bin/sh, /run/run-unprivileged.sh]
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    user: "${DEPLOY_UID:?Run prepare.py first}:${DEPLOY_GID:?Run prepare.py first}"
    networks: [api]
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    # Scoped to this container's network namespace, never to the host.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    volumes:
      - ./run-unprivileged.sh:/run/run-unprivileged.sh:ro
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./runtime/caddy-data:/data
      - ./runtime/caddy-config:/config
    depends_on:
      credentials: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  api:
    driver: bridge
