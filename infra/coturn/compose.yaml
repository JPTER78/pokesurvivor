name: pokesurvivor-turn
services:
  coturn:
    image: coturn/coturn:4.18.0-r0
    entrypoint: [turnserver]
    command: [-c, /etc/coturn/turnserver.conf]
    user: "${DEPLOY_UID:?Run prepare.py first}:${DEPLOY_GID:?Run prepare.py first}"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, /var/lib/coturn]
    volumes:
      - ./runtime/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/certs:ro
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 128
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  credentials:
    build: ./broker
    user: "${DEPLOY_UID:?Run prepare.py first}:${DEPLOY_GID:?Run prepare.py first}"
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CONFIG_FILE: /run/turn/broker.json
      SECRET_FILE: /run/turn/auth-secret
      NODE_ENV: production
    volumes:
      - ./runtime/broker.json:/run/turn/broker.json:ro
      - ./runtime/auth-secret:/run/turn/auth-secret:ro
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  https:
    image: caddy:2.11.7-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./runtime/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      credentials: {condition: service_healthy}
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  caddy_data:
  caddy_config:
