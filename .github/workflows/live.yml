# ¿Está el canal de YouTube en directo? Cada 5 min (GitHub lo retrasa a veces
# unos minutos) mira los directos del canal y deja live.json en la rama
# «live»: { live, id, at }. El juego la lee (js/ui/live-ui.js) sin Firebase.
# Sólo se sube algo al cambiar o, en directo, cada 30 min (para que «at» no
# caduque). Gratis: el repositorio es público.
name: live

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live
      - name: Mirar el canal
        run: |
          set -u
          get() {
            curl -sL --max-time 20 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36' \
              -H 'Accept-Language: en' --cookie 'CONSENT=YES+1; SOCS=CAI' "$1" -o "$2" || true
          }
          # No sirve /live: lleva a una emisión de la PS4 de 2018 que sigue «programada»
          # (afwp0I0hZeY) y no al directo de verdad (por eso el 27-10-2026 no se vio).
          # Se mira la pestaña de directos y, de los 3 primeros vídeos, la ficha de cada uno.
          get 'https://www.youtube.com/channel/UC5nyI589EfbS3KvyNdAVOGA/streams' streams.html
          # Si YouTube no da la página de verdad (aviso de bots, error...), no se toca nada.
          if ! grep -qE '"(channelId|externalId|browseId)":"UC5nyI589EfbS3KvyNdAVOGA"' streams.html; then echo 'página rara: sin cambios'; rm -f streams.html; exit 0; fi
          live=false; id=''
          for v in $(grep -oE '"videoId":"[A-Za-z0-9_-]{11}"' streams.html | cut -d'"' -f4 | awk '!s[$0]++' | head -3); do
            get "https://www.youtube.com/watch?v=$v" video.html
            if ! grep -q '"channelId":"UC5nyI589EfbS3KvyNdAVOGA"' video.html; then
              echo "ficha rara de $v: sin cambios"; rm -f streams.html video.html; exit 0
            fi
            # En directo ahora: isLiveNow true (al acabar pasa a false y lleva endTimestamp).
            if grep -q '"liveBroadcastDetails":{"isLiveNow":true' video.html; then id=$v; live=true; break; fi
          done
          rm -f streams.html video.html
          old_live=$(grep -oE '"live":(true|false)' live.json 2>/dev/null | cut -d: -f2)
          old_id=$(grep -oE '"id":"[^"]*"' live.json 2>/dev/null | cut -d'"' -f4)
          old_at=$(grep -oE '"at":"[^"]*"' live.json 2>/dev/null | cut -d'"' -f4)
          age=$(( $(date +%s) - $(date -d "${old_at:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$live" = "${old_live:-}" ] && [ "$id" = "${old_id:-}" ] && { [ "$live" = false ] || [ "$age" -lt 1800 ]; }; then
            echo "sin cambios (live=$live)"; exit 0
          fi
          printf '{"live":%s,"id":"%s","at":"%s"}\n' "$live" "$id" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > live.json
          cat live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live.json
          git commit -q -m "live: $live $id"
          git push -q origin HEAD:live
